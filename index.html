<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>TimCargo Булаево | Проверка адреса</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --red-accent: #e8112d;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --border-color: #2a2a2a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 20px;
      margin: 20px 0;
      border: 1px solid var(--border-color);
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 40px;
      background: var(--red-accent);
      color: white;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
    }
    .preview-img {
      max-width: 100%;
      max-height: 200px;
      margin-top: 10px;
      border-radius: 12px;
      display: none;
    }
    .result-box {
      background: var(--bg-secondary);
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #8bc34a; }
    .error { color: #ff8a80; }
    textarea, input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 10px;
      color: white;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 TimCargo Булаево</h1>
  <p>Проверка адреса доставки из Pinduoduo</p>

  <div class="card">
    <h3>📸 Проверка скриншота</h3>
    <label for="screenshotInput" class="btn btn-outline" style="display: inline-block;">📂 Выбрать скриншот</label>
    <input type="file" id="screenshotInput" accept="image/*" style="display: none;">
    <img id="previewImage" class="preview-img" alt="Предпросмотр">
    <textarea id="customQuestion" rows="2" placeholder="(Необязательно) Ваш комментарий"></textarea>
    <button id="analyzeBtn" class="btn">🔍 Проверить адрес</button>
    <div id="resultArea" class="result-box" style="display: none;"></div>
  </div>

  <div style="margin-top: 20px;">
    <a href="https://wa.me/77773363666" class="btn">WhatsApp</a>
    <a href="tel:+77773363666" class="btn btn-outline">Позвонить</a>
  </div>
</div>

<script>
  (function() {
    const screenshotInput = document.getElementById('screenshotInput');
    const previewImg = document.getElementById('previewImage');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultArea = document.getElementById('resultArea');
    const customQuestion = document.getElementById('customQuestion');

    // Показ предпросмотра
    screenshotInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewImg.src = ev.target.result;
          previewImg.style.display = 'block';
        };
        reader.readAsDataURL(file);
        resultArea.style.display = 'none';
      } else {
        previewImg.style.display = 'none';
      }
    });

    // Проверка адреса по распознанному тексту
    function analyzeAddress(fullText) {
      // Приводим к нижнему регистру для поиска (но некоторые ключи оставим как есть)
      const lowerText = fullText.toLowerCase();
      const originalText = fullText;

      // 1. Телефон
      const phoneRegex = /1\d{10}/; // 11 цифр, начинается с 1 (китайский формат)
      const hasPhone = phoneRegex.test(originalText);
      const foundPhone = hasPhone ? originalText.match(phoneRegex)[0] : null;

      // 2. Ключевые фрагменты адреса (оригинальные иероглифы)
      const addressParts = [
        '低调NORD',
        '8787库房',
        '浙江省',
        '金华市',
        '义乌市',
        '福田街道',
        '龙岗路一街6号'
      ];
      let foundParts = [];
      for (let part of addressParts) {
        if (originalText.includes(part)) foundParts.push(part);
      }
      const isAddressComplete = foundParts.length >= 5; // достаточно большая часть

      // 3. Код XXXX 22
      const codeRegex = /\b(\d{4})\s*22\b/;
      const hasCode = codeRegex.test(originalText);
      const foundCode = hasCode ? originalText.match(codeRegex)[0] : null;

      // Формируем ответ
      let result = '';
      if (hasPhone && isAddressComplete && hasCode) {
        result = '✅ Адрес корректен!\n';
      } else {
        result = '❌ Адрес НЕ корректен. Проблемы:\n';
        if (!hasPhone) result += '   - Не найден номер телефона (должен быть 18957788787)\n';
        if (!isAddressComplete) result += `   - Не все части адреса найдены (найдено ${foundParts.length} из 7)\n`;
        if (!hasCode) result += '   - Отсутствует личный код (формат XXXX 22)\n';
      }

      // Детали
      if (hasPhone) result += `\n📞 Телефон: ${foundPhone}`;
      if (foundParts.length > 0) result += `\n📍 Найдены фрагменты адреса: ${foundParts.join(', ')}`;
      if (foundCode) result += `\n🔑 Личный код: ${foundCode}`;

      // Распознанный текст полностью (для отладки)
      result += `\n\n--- Распознанный текст (первые 500 символов) ---\n${fullText.substring(0, 500)}${fullText.length > 500 ? '…' : ''}`;

      return result;
    }

    // Обработка клика
    analyzeBtn.addEventListener('click', async () => {
      const file = screenshotInput.files[0];
      if (!file) {
        alert('Сначала выберите скриншот');
        return;
      }

      resultArea.style.display = 'block';
      resultArea.innerHTML = '<span class="loader"></span> Распознаю текст (русский, английский, китайский)...';
      analyzeBtn.disabled = true;

      try {
        const worker = await Tesseract.createWorker('rus+eng+chi_sim');
        const { data: { text } } = await worker.recognize(file);
        await worker.terminate();

        if (!text || text.trim().length === 0) {
          resultArea.innerHTML = '⚠️ Не удалось распознать текст. Попробуйте более чёткое фото.';
          analyzeBtn.disabled = false;
          return;
        }

        const analysis = analyzeAddress(text);
        let final = analysis;
        if (customQuestion.value.trim()) {
          final += `\n\n💬 Ваш вопрос: ${customQuestion.value}\n(Ответ: на основе анализа адреса выше)`;
        }
        resultArea.innerHTML = final;
      } catch (err) {
        console.error(err);
        resultArea.innerHTML = '❌ Ошибка при анализе. Попробуйте другой скриншот.';
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    // Клик по лейблу для выбора файла
    document.querySelector('label[for="screenshotInput"]').addEventListener('click', () => screenshotInput.click());
  })();
</script>
</body>
</html>
