<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>TimCargo | Проверка адреса Pinduoduo</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
      padding: 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #e8112d;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #2a2a2a;
    }
    .preview {
      max-width: 100%;
      max-height: 200px;
      margin-top: 10px;
      border-radius: 16px;
      display: none;
    }
    .result {
      background: #111;
      padding: 15px;
      border-radius: 16px;
      margin-top: 15px;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 10px;
      color: white;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 TimCargo Булаево</h1>
  <p>Проверка адреса по скриншоту Pinduoduo</p>

  <div class="card">
    <h3>📸 Загрузите скриншот</h3>
    <label for="screenshot" class="btn btn-outline" style="display: inline-block;">📂 Выбрать фото</label>
    <input type="file" id="screenshot" accept="image/*" style="display: none;">
    <img id="preview" class="preview" alt="Предпросмотр">
    <textarea id="userComment" rows="2" placeholder="(Необязательно) Ваш комментарий"></textarea>
    <button id="analyzeBtn" class="btn">🔍 Проверить адрес</button>
    <div id="result" class="result" style="display: none;"></div>
  </div>

  <div>
    <a href="https://wa.me/77773363666" class="btn">WhatsApp</a>
    <a href="tel:+77773363666" class="btn btn-outline">Позвонить</a>
  </div>
</div>

<script>
  (function() {
    const screenshotInput = document.getElementById('screenshot');
    const previewImg = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultDiv = document.getElementById('result');
    const userComment = document.getElementById('userComment');

    const AI_WORKER_URL = 'https://ai.lazyshadow777.workers.dev/';

    screenshotInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewImg.src = ev.target.result;
          previewImg.style.display = 'block';
        };
        reader.readAsDataURL(file);
        resultDiv.style.display = 'none';
      } else {
        previewImg.style.display = 'none';
      }
    });

    analyzeBtn.addEventListener('click', async () => {
      const file = screenshotInput.files[0];
      if (!file) {
        alert('Сначала выберите скриншот');
        return;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<span class="loader"></span> Распознаю текст...';
      analyzeBtn.disabled = true;

      try {
        const worker = await Tesseract.createWorker('rus+eng+chi_sim');
        const { data: { text } } = await worker.recognize(file);
        await worker.terminate();

        if (!text || text.trim().length === 0) {
          resultDiv.innerHTML = '⚠️ Не удалось распознать текст. Попробуйте более чёткое фото.';
          analyzeBtn.disabled = false;
          return;
        }

        const prompt = `Ты — эксперт по проверке адресов доставки из Pinduoduo. Сравни распознанный текст с эталонным адресом.

Эталонный адрес (правильный):
浙江省 金华市 义乌市 福田街道 龙岗路一街6号 8787库房

Распознанный текст:
"""${text}"""

Твоя задача: проверить, совпадает ли адресная часть (включая город, район, улицу, номер дома, склад) с эталоном.  
Игнорируй:
- Имя пользователя (например "低调NORD 001")
- Номер телефона (например 18957788787 или 87052538362)
- Личный код (формат "XXXX 22")

Ответ дай в формате:
✅ Адрес верный (если все элементы адреса совпадают)
❌ Адрес неверный — что именно не совпадает (если есть расхождения)
Также перечисли, что было распознано.

Никаких лишних рассуждений, только краткий вердикт.`;

        const aiResp = await fetch(AI_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt, history: [] })
        });

        if (!aiResp.ok) throw new Error(`HTTP ${aiResp.status}`);
        const aiData = await aiResp.json();
        let analysis = aiData.response || 'Нет ответа от ИИ';

        if (userComment.value.trim()) {
          analysis += `\n\n💬 Ваш комментарий: ${userComment.value}`;
        }

        resultDiv.innerHTML = analysis;
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `❌ Ошибка: ${err.message}. Проверьте работу воркера и CORS.`;
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    document.querySelector('label[for="screenshot"]').addEventListener('click', () => screenshotInput.click());
  })();
</script>
</body>
</html>
