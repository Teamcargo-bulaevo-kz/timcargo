<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>TimCargo | Доставка из Китая</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #e8112d;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #2a2a2a;
    }
    .btn-outline:hover {
      border-color: #e8112d;
      background: rgba(232,17,45,0.1);
    }
    .preview {
      max-width: 100%;
      max-height: 200px;
      margin-top: 10px;
      border-radius: 16px;
      display: none;
    }
    .result {
      background: #111;
      padding: 15px;
      border-radius: 16px;
      margin-top: 15px;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .code-block {
      font-size: 2rem;
      font-weight: bold;
      background: #2a2a36;
      padding: 12px;
      border-radius: 20px;
      text-align: center;
      margin: 10px 0;
      letter-spacing: 2px;
    }
    .flex-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    h3 { margin-bottom: 0.5rem; }
    .small-note { font-size: 0.8rem; color: #aaa; margin-top: 10px; text-align: center; }
    .contact-bar { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 TimCargo Булаево</h1>
  <p>Карго‑доставка из Китая | Проверка адреса</p>

  <!-- Блок с персональным кодом -->
  <div class="card">
    <h3>🔑 Ваш уникальный код для адреса</h3>
    <div id="userCodeDisplay" class="code-block">—</div>
    <div class="flex-buttons">
      <button id="refreshCodeBtn" class="btn btn-outline">🔄 Получить новый код</button>
      <button id="copyCodeBtn" class="btn btn-outline">📋 Скопировать код</button>
    </div>
    <div class="small-note">Код (XXXX 22) нужно указывать в конце адреса. Каждому клиенту выдаётся уникальный код.</div>
  </div>

  <!-- Блок проверки адреса (без поля ввода) -->
  <div class="card">
    <h3>📸 Проверка скриншота адреса</h3>
    <label for="screenshot" class="btn btn-outline" style="display: inline-block;">📂 Выбрать скриншот</label>
    <input type="file" id="screenshot" accept="image/*" style="display: none;">
    <img id="preview" class="preview" alt="Предпросмотр">
    <button id="analyzeBtn" class="btn" style="margin-top: 15px;">🔍 Проверить адрес</button>
    <div id="result" class="result" style="display: none;"></div>
  </div>

  <!-- Контакты -->
  <div class="contact-bar">
    <a href="https://wa.me/77773363666" class="btn">WhatsApp</a>
    <a href="tel:+77773363666" class="btn btn-outline">Позвонить</a>
  </div>
</div>

<script>
  (function() {
    const screenshotInput = document.getElementById('screenshot');
    const previewImg = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultDiv = document.getElementById('result');
    const userCodeSpan = document.getElementById('userCodeDisplay');
    const refreshBtn = document.getElementById('refreshCodeBtn');
    const copyCodeBtn = document.getElementById('copyCodeBtn');

    const WORKER_URL = 'https://ai.lazyshadow777.workers.dev'; // ваш воркер (без слеша)

    // --- Код: получение, обновление, копирование ---
    async function loadCode() {
      try {
        const resp = await fetch(`${WORKER_URL}/api/get-code`);
        const data = await resp.json();
        userCodeSpan.innerText = data.code || 'Ошибка';
      } catch (err) {
        console.error(err);
        userCodeSpan.innerText = '⚠️ Недоступно';
      }
    }
    async function refreshCode() {
      try {
        const resp = await fetch(`${WORKER_URL}/api/refresh-code`);
        const data = await resp.json();
        userCodeSpan.innerText = data.code;
      } catch (err) {
        alert('Не удалось обновить код');
      }
    }
    function copyCode() {
      const code = userCodeSpan.innerText;
      if (code && code !== '—' && code !== '⚠️ Недоступно') {
        navigator.clipboard.writeText(code).then(() => alert('Код скопирован: ' + code)).catch(() => alert('Ошибка копирования'));
      } else {
        alert('Код ещё не загружен');
      }
    }
    refreshBtn.addEventListener('click', refreshCode);
    copyCodeBtn.addEventListener('click', copyCode);
    loadCode();

    // --- Предпросмотр фото ---
    screenshotInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => { previewImg.src = ev.target.result; previewImg.style.display = 'block'; };
        reader.readAsDataURL(file);
        resultDiv.style.display = 'none';
      } else {
        previewImg.style.display = 'none';
      }
    });

    // --- Анализ адреса через ИИ (с проверкой кода) ---
    analyzeBtn.addEventListener('click', async () => {
      const file = screenshotInput.files[0];
      if (!file) { alert('Выберите скриншот'); return; }
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<span class="loader"></span> Распознаю текст...';
      analyzeBtn.disabled = true;

      try {
        const worker = await Tesseract.createWorker('rus+eng+chi_sim');
        const { data: { text } } = await worker.recognize(file);
        await worker.terminate();

        if (!text || text.trim().length === 0) {
          resultDiv.innerHTML = '⚠️ Не удалось распознать текст. Попробуйте более чёткое фото.';
          analyzeBtn.disabled = false;
          return;
        }

        const userCode = userCodeSpan.innerText;
        const prompt = `Ты — эксперт по проверке адресов Pinduoduo.

ЭТАЛОННЫЙ адрес: 浙江省 金华市 义乌市 福田街道 龙岗路一街6号 8787库房

Распознанный текст:
"""${text}"""

Проверь, содержит ли распознанный текст все элементы эталонного адреса. Игнорируй имена, номера телефонов, лишние служебные слова. Если на скриншоте несколько адресов, выбери тот, который является адресом доставки (обычно после "上次使用").

Также проверь, присутствует ли в тексте личный код пользователя. Личный код пользователя: ${userCode}. Код имеет формат "XXXX 22" (четыре цифры и 22). Если код отсутствует или не совпадает, укажи это.

Ответ дай в формате:
[ВЕРДИКТ] — ✅ Адрес ВЕРНЫЙ (или ❌ НЕВЕРНЫЙ)
[КОД] — ✅ Код совпадает / ❌ Код не найден / ⚠️ Код другой

Затем кратко поясни.

Если адрес верный, добавь: "✅ Напоминание: не забудьте поставить галочку, выбрав этот адрес."
Если адрес неверный, добавь: "❌ Совет: посмотрите видеоинструкцию и скопируйте адрес с сайта."`;

        const aiResp = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt, history: [] })
        });
        if (!aiResp.ok) throw new Error(`HTTP ${aiResp.status}`);
        const aiData = await aiResp.json();
        let analysis = aiData.response || 'Нет ответа от ИИ';
        resultDiv.innerHTML = analysis;
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `❌ Ошибка: ${err.message}`;
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    document.querySelector('label[for="screenshot"]').addEventListener('click', () => screenshotInput.click());
  })();
</script>
</body>
</html>
