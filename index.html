<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>TimCargo | Проверка адреса Pinduoduo</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #1a1a1a;
      --red: #e8112d;
      --text: #f0f0f0;
      --border: #2a2a2a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      padding: 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: var(--red);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
    }
    .preview {
      max-width: 100%;
      max-height: 200px;
      margin-top: 10px;
      border-radius: 16px;
      display: none;
    }
    .result {
      background: #111;
      padding: 15px;
      border-radius: 16px;
      margin-top: 15px;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    textarea {
      width: 100%;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px;
      color: white;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 TimCargo Булаево</h1>
  <p>Проверка адреса по скриншоту Pinduoduo</p>

  <div class="card">
    <h3>📸 Загрузите скриншот</h3>
    <label for="screenshot" class="btn btn-outline" style="display: inline-block;">📂 Выбрать фото</label>
    <input type="file" id="screenshot" accept="image/*" style="display: none;">
    <img id="preview" class="preview" alt="Предпросмотр">
    <textarea id="userComment" rows="2" placeholder="(Необязательно) Ваш комментарий"></textarea>
    <button id="analyzeBtn" class="btn">🔍 Проверить адрес</button>
    <div id="result" class="result" style="display: none;"></div>
  </div>

  <div>
    <a href="https://wa.me/77773363666" class="btn">WhatsApp</a>
    <a href="tel:+77773363666" class="btn btn-outline">Позвонить</a>
  </div>
</div>

<script>
  (function() {
    // --- Элементы ---
    const screenshotInput = document.getElementById('screenshot');
    const previewImg = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultDiv = document.getElementById('result');
    const userComment = document.getElementById('userComment');

    // --- ВАШ URL рабочего ИИ-воркера ---
    const AI_WORKER_URL = 'https://ai.lazyshadow777.workers.dev/';

    // Предпросмотр фото
    screenshotInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewImg.src = ev.target.result;
          previewImg.style.display = 'block';
        };
        reader.readAsDataURL(file);
        resultDiv.style.display = 'none';
      } else {
        previewImg.style.display = 'none';
      }
    });

    // Отправка на ИИ
    analyzeBtn.addEventListener('click', async () => {
      const file = screenshotInput.files[0];
      if (!file) {
        alert('Сначала выберите скриншот');
        return;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<span class="loader"></span> Распознаю текст...';
      analyzeBtn.disabled = true;

      try {
        // 1. Распознаём текст через Tesseract
        const worker = await Tesseract.createWorker('rus+eng+chi_sim');
        const { data: { text } } = await worker.recognize(file);
        await worker.terminate();

        if (!text || text.trim().length === 0) {
          resultDiv.innerHTML = '⚠️ Не удалось распознать текст. Попробуйте более чёткое фото.';
          analyzeBtn.disabled = false;
          return;
        }

        // 2. Формируем промпт для ИИ
        const prompt = `Ты — эксперт по проверке адресов доставки из Pinduoduo. Проанализируй распознанный текст со скриншота.

Распознанный текст:
"""${text}"""

Твоя задача:
- Найти номер телефона. Правильный номер: 18957788787. Если номер другой — укажи это.
- Найти имя пользователя (обычно "低调NORD XXX").
- Найти полный адрес: провинция, город, район, улица, номер дома, упоминание "8787库房".
- Найти персональный код (формат "XXXX 22", где XXXX — четыре цифры).
- Проверить, что адрес соответствует шаблону (наличие всех частей).

Ответ дай на русском языке, структурированно, примерно так:
📞 Телефон: (найден/не найден, какой)
👤 Имя пользователя: (какое)
📍 Адрес: (что найдено, чего не хватает)
🔑 Персональный код: (найден/не найден, какой)
---
✅ ИТОГ: адрес корректен / не корректен (и почему)

Не добавляй лишних рассуждений, только факты.`;

        // 3. Отправляем запрос к вашему воркеру
        const aiResp = await fetch(AI_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt, history: [] })
        });

        if (!aiResp.ok) throw new Error(`Ошибка ИИ: ${aiResp.status}`);
        const aiData = await aiResp.json();
        let analysis = aiData.response || 'Нет ответа от ИИ';

        // Добавляем комментарий пользователя, если есть
        if (userComment.value.trim()) {
          analysis += `\n\n💬 Ваш комментарий: ${userComment.value}`;
        }

        resultDiv.innerHTML = analysis;
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `❌ Ошибка: ${err.message}. Проверьте, что ваш ИИ-воркер доступен по адресу ${AI_WORKER_URL}`;
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    document.querySelector('label[for="screenshot"]').addEventListener('click', () => screenshotInput.click());
  })();
</script>
</body>
</html>
